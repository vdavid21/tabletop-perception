[project]
name = "tabletop-training"
version = "0.1.0"
description = "Training code for the tabletop-perception segmentation models"
readme = "README.md"
authors = [
    { name = "David Vincze", email = "davidvincze21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
tabletop-training = "tabletop_training:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
